name: Auto Push Updates

on:
  push:
    paths:
      - powerautomate/**
      - powerapps/**
  workflow_dispatch:
jobs:
  auto-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Configure Git
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
      - name: Commit and Push Changes
        run: |
          git add .
          git commit -m 'Auto update from workflow' || echo 'No changes to commit'
          git push
