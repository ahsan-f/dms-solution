name: Validate Power Apps .msapp File

on:
  push:
    paths:
      - powerapps/DMSExpenseApp.msapp
  workflow_dispatch:

jobs:
  validate-msapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Validate .msapp structure
        run: unzip -l powerapps/DMSExpenseApp.msapp || echo 'Invalid .msapp file structure'
