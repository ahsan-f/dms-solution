name: Lint and Package Power Automate Flows

on:
  push:
    paths:
      - powerautomate/*.json
  workflow_dispatch:

jobs:
  lint-flows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Lint JSON files
        run: for file in powerautomate/*.json; do jq empty "$file" || exit 1; done
      - name: Package flows
        run: zip -r flows_export.zip powerautomate/
